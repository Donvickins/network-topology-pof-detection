[project]
name = "network-topology-pof-detection"
version = "0.1.0"
description = "Network Topology Point-of-Failure detection system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "pydantic==2.13.5",
  "ultralytics==8.4.154",
  "pillow==12.3.0",
  "opencv-python==5.0.0.93",
  "pytesseract==0.3.13",
  "rapidfuzz==3.14.6",
  "fastapi-guard==8.0.2",
  "python-Levenshtein==0.27.5",
  "scipy==1.18.1",
  "numpy==2.5.3",
  "pyyaml==6.0.3",
  "colorama==0.4.6",
  "torch-geometric==2.8.0.post1",
]

[project.optional-dependencies]
cpu = [
  "torch==2.14.0",
  "torchvision==0.29.0",
]
cuda = [
  "torch==2.14.0",
  "torchvision==0.29.0",
]
train = ["matplotlib==3.11.2"]
build = ["nuitka==4.2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build_meta"

[tool.hatch.build.targets.wheel]
packages = ["."]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "cuda", marker = "sys_platform == 'darwin'" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "cuda", marker = "sys_platform == 'darwin'" },
]

[tool.uv]
managed = true
package = true
conflicts = [
  [{"extra" = "cpu"}, {"extra" = "cuda"}]
]
